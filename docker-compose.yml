name: ${COMPOSE_PROJECT_NAME:-ecomapp-for-system-architecture-main}

services:
  db:
    image: ${IMAGE_NAMESPACE:-ecomapp}/database:${IMAGE_TAG:-local}
    build: ./db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-migrate:
    image: ${IMAGE_NAMESPACE:-ecomapp}/db-migrate:${IMAGE_TAG:-local}
    build: ./scripts
    command: ["npm", "run", "migrate"]
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-app_user}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  auth-service:
    image: ${IMAGE_NAMESPACE:-ecomapp}/auth-service:${IMAGE_TAG:-local}
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_PORT:-4001}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-app_user}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:${AUTH_PORT:-4001}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog-service:
    image: ${IMAGE_NAMESPACE:-ecomapp}/catalog-service:${IMAGE_TAG:-local}
    build: ./services/catalog-service
    restart: unless-stopped
    environment:
      PORT: ${CATALOG_PORT:-4002}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-app_user}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:${CATALOG_PORT:-4002}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  order-service:
    image: ${IMAGE_NAMESPACE:-ecomapp}/order-service:${IMAGE_TAG:-local}
    build: ./services/order-service
    restart: unless-stopped
    environment:
      PORT: ${ORDER_PORT:-4003}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-app_user}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:${ORDER_PORT:-4003}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: ${IMAGE_NAMESPACE:-ecomapp}/frontend:${IMAGE_TAG:-local}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  proxy:
    image: ${IMAGE_NAMESPACE:-ecomapp}/proxy:${IMAGE_TAG:-local}
    build: ./proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/products >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  smoke-test:
    image: ${IMAGE_NAMESPACE:-ecomapp}/smoke-test:${IMAGE_TAG:-local}
    build: ./scripts
    profiles:
      - test
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      BASE_URL: http://proxy:8080
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
